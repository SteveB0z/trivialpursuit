<!DOCTYPE html>
<html>

<head lang="en">
    <meta charset="UTF-8">
    <title>Expendables Trivial Pursuit</title>

    <link rel="stylesheet" type="text/css" href="css/normalize.css">
    <link rel="stylesheet" type="text/css" href="css/gamepieces.css">
    <link rel="stylesheet" type="text/css" href="css/wedges.css">
    <link rel="stylesheet" type="text/css" href="css/game.css">

    <script type="text/javascript" src="scripts/jquery-2.1.4.min.js"></script>
    <script type="text/javascript" src="scripts/gamescripts.js"></script>
    <script type='text/javascript' src='dice-roller/d6.js'></script>
</head>

<body>
    <div id="window-container">
        <div id="game-container">

            <div id="board-left">
                <img id="logo" class="noselect" src="images/tpelogo.png" alt="" />

                <br />

                <table id="score-table">
                    <tr>
                        <th>Teams</th>
                        <th>
                            <span id="w0" class="wedge wedge0" draggable="true"
                                data-draggable="master-wedge">&#9660;</span>
                            <span id="w1" class="wedge wedge1" draggable="true"
                                data-draggable="master-wedge">&#9660;</span>
                            <span id="w2" class="wedge wedge2" draggable="true"
                                data-draggable="master-wedge">&#9660;</span>
                            <span id="w3" class="wedge wedge3" draggable="true"
                                data-draggable="master-wedge">&#9660;</span>
                            <span id="w4" class="wedge wedge4" draggable="true"
                                data-draggable="master-wedge">&#9660;</span>
                            <span id="w5" class="wedge wedge5" draggable="true"
                                data-draggable="master-wedge">&#9660;</span>
                        </th>
                    </tr>
                    <tr>
                        <td style="color:#94FF4B"><input type="text" class="team-name-input" id="team0"
                                placeholder="Lime" style="color:#94FF4B" /></td>
                        <td id="t0"></td>
                    </tr>
                    <tr>
                        <td style="color:#53FEFF"><input type="text" class="team-name-input" id="team1"
                                placeholder="Azzurro" style="color:#53FEFF" /></td>
                        <td id="t1"></td>
                    </tr>
                    <tr>
                        <td style="color:#FF4848"><input type="text" class="team-name-input" id="team2"
                                placeholder="Rosso" style="color:#FF4848" /></td>
                        <td id="t2"></td>
                    </tr>
                    <tr>
                        <td style="color:#FF56F7"><input type="text" class="team-name-input" id="team3"
                                placeholder="Viola" style="color:#FF56F7" /></td>
                        <td id="t3"></td>
                    </tr>
                    <!--
                    <tr>
                        <td style="color:#2B9FD2">Azzurro</td>
                        <td id="t4"></td>
                    </tr>
                    <tr>
                        <td style="color:#6AAD4E">Verde</td>
                        <td id="t5"></td>
                    </tr>-->
                </table>

                <br />

                <table id="categories-table">
                    <tr>
                        <th colspan="2">Categorie</th>
                    </tr>
                    <tr>
                        <td><span class="wedge wedge0">&#9660;</span></td>
                        <td><input type="text" class="category-input" id="cat0" placeholder="Categoria 1" /></td>
                    </tr>
                    <tr>
                        <td><span class="wedge wedge1">&#9660;</span></td>
                        <td><input type="text" class="category-input" id="cat1" placeholder="Categoria 2" /></td>
                    </tr>
                    <tr>
                        <td><span class="wedge wedge2">&#9660;</span></td>
                        <td><input type="text" class="category-input" id="cat2" placeholder="Categoria 3" /></td>
                    </tr>
                    <tr>
                        <td><span class="wedge wedge3">&#9660;</span></td>
                        <td><input type="text" class="category-input" id="cat3" placeholder="Categoria 4" /></td>
                    </tr>
                    <tr>
                        <td><span class="wedge wedge4">&#9660;</span></td>
                        <td><input type="text" class="category-input" id="cat4" placeholder="Categoria 5" /></td>
                    </tr>
                    <tr>
                        <td><span class="wedge wedge5">&#9660;</span></td>
                        <td><input type="text" class="category-input" id="cat5" placeholder="Categoria 6" /></td>
                    </tr>
                </table>

                <br />

                <table id="dice-table">
                    <tr>
                        <td class="dice-section">
                            <div class="dice-column">
                                <script type="text/javascript">
                                    D6.setBaseUrl('dice-roller/');
                                    D6.dice(1);
                                    D6.setButtonLabel('Tira il dado!');
                                    $('.die').css('width', '70px');
                                    D6.roll();
                                </script>
                            </div>
                        </td>
                        <td class="timer-section">
                            <div id="timer-container">
                                <div id="timer-display">60</div>
                                <div class="timer-buttons">
                                    <button id="timer-start-btn" onclick="gamescripts.startTimer()">Avvia Timer</button>
                                    <button id="timer-reset-btn" onclick="gamescripts.resetTimer()">Reset</button>
                                </div>
                            </div>
                        </td>
                    </tr>
                </table>

                <br />

                <button id="reset-button" onclick="gamescripts.resetGame()">Resetta il gioco</button>

                <br />

            </div>

            <div id="board-right">
                <img id="board" class="noselect" data-draggable="target" src="images/tabellone 4K.jpg" alt="" />

                <table id="pieces-table">
                    <tr>
                        <td>
                            <div id="p0" class="gamepiece" draggable="true" data-draggable="gamepiece"
                                style="background-color:#94FF4B"></div>
                        </td>
                        <td>
                            <div id="p1" class="gamepiece" draggable="true" data-draggable="gamepiece"
                                style="background-color:#53FEFF"></div>
                        </td>
                        <td>
                            <div id="p2" class="gamepiece" draggable="true" data-draggable="gamepiece"
                                style="background-color:#FF4848"></div>
                        </td>
                        <td>
                            <div id="p3" class="gamepiece" draggable="true" data-draggable="gamepiece"
                                style="background-color:#FF56F7"></div>
                        </td>
                        <!--<td>
                            <div id="p4" class="gamepiece" draggable="true" data-draggable="gamepiece"
                                style="background-color:#2B9FD2"></div>
                        </td>
                        <td>
                            <div id="p5" class="gamepiece" draggable="true" data-draggable="gamepiece"
                                style="background-color:#6AAD4E"></div>
                        </td>-->
                    </tr>
                </table>

                <!--<img id="p0" class="gamepiece" draggable="true" data-draggable="gp" src="images/p0.png" alt="" />
            <img id="p1" class="gamepiece" draggable="true" data-draggable="gp" src="images/p1.png" alt="" />
            <img id="p2" class="gamepiece" draggable="true" data-draggable="gp" src="images/p2.png" alt="" />
            <img id="p3" class="gamepiece" draggable="true" data-draggable="gp" src="images/p3.png" alt="" />
            <img id="p4" class="gamepiece" draggable="true" data-draggable="gp" src="images/p4.png" alt="" />
            <img id="p5" class="gamepiece" draggable="true" data-draggable="gp" src="images/p5.png" alt="" />-->
            </div>

        </div>
    </div>
</body>

</html>
